<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7eee9">
  <title>天然美容商品型錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beauty: {
              cream: '#fcf8f5',
              blush: '#f4e5df',
              rose: '#d9a99d',
              terracotta: '#b96f61',
              deep: '#63463f',
              sage: '#9eaa91',
              line: '#ead8d1',
              gold: '#c69b69'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif TC"', 'serif'],
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC", sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #fcf8f5; color: #63463f; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    
    /* 左側滑出抽屜選單樣式 */
    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: -100%;
      width: 280px;
      height: 100%;
      z-index: 60;
      background: #f7eee9;
      border-right: 1px solid #ead8d1;
      box-shadow: 10px 0 30px rgba(99,70,63,0.15);
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .sidebar-drawer.open {
      left: 0;
    }
    
    /* 遮罩背景 */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(99, 70, 63, 0.4);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .cat-btn {
      width: 100%;
      color: #65466f;
      background: rgba(255,255,255,.6);
      border: 1px solid rgba(158,122,169,.18);
      transition: all 0.2s;
    }
    .cat-btn:hover {
      background: rgba(255,255,255,.9);
      transform: translateX(2px);
    }
    .cat-btn.is-active {
      background: #8d609b;
      color: white;
      border-color: #8d609b;
      box-shadow: 0 4px 12px rgba(111,72,124,.2);
    }
    .cat-btn.is-active span:last-child {
      color: rgba(255,255,255,.85);
    }

    .category-section + .category-section { margin-top: 2.5rem; }
    .category-section-heading { scroll-margin-top: 90px; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen pb-16">

  <!-- 頂部導航列 (最左側放置三條線漢堡按鈕) -->
  <header class="sticky top-0 z-40 border-b border-beauty-line/80 bg-beauty-blush/95 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
      
      <div class="flex items-center gap-3">
        <!-- 三條線漢堡選單按鈕 (置於最左側) -->
        <button id="menu-toggle-btn" onclick="toggleSidebar()" aria-expanded="false" aria-controls="sidebar-menu" class="w-10 h-10 rounded-xl bg-white border border-beauty-line flex flex-col items-center justify-center gap-1.5 shadow-sm text-beauty-deep hover:bg-beauty-cream transition cursor-pointer shrink-0">
          <span class="w-5 h-0.5 bg-beauty-deep rounded-full"></span>
          <span class="w-5 h-0.5 bg-beauty-deep rounded-full"></span>
          <span class="w-5 h-0.5 bg-beauty-deep rounded-full"></span>
        </button>

        <div class="flex items-center gap-3">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-beauty-terracotta text-white flex items-center justify-center font-serif font-bold text-sm sm:text-base shadow-sm">SP</div>
          <div>
            <h1 class="font-serif font-bold text-base sm:text-xl tracking-[.15em] sm:tracking-[.18em] text-beauty-deep leading-tight">SWISS DERMA</h1>
            <p class="text-[10px] sm:text-[11px] tracking-[.2em] text-beauty-terracotta">天然養膚・安心保養</p>
          </div>
        </div>
      </div>
  </header>

  <!-- 左側滑出抽屜選單 -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>
  <aside id="sidebar-menu" class="sidebar-drawer p-5">
    <div class="flex items-center justify-between pb-4 border-b border-beauty-line mb-4">
      <div class="font-serif font-bold text-base text-beauty-deep flex items-center gap-2">
        <span>🍀</span> 商品分類導覽
      </div>
      <button onclick="toggleSidebar()" class="w-8 h-8 rounded-full bg-white border border-beauty-line flex items-center justify-center text-beauty-deep hover:bg-beauty-blush transition">✕</button>
    </div>
    <nav id="category-bar" class="flex flex-col gap-2.5 overflow-y-auto no-scrollbar flex-1" aria-label="商品分類"></nav>
  </aside>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <section class="mb-6 sm:mb-8 rounded-3xl border border-beauty-line bg-white/70 px-5 py-6 sm:px-8 sm:py-8 shadow-[0_12px_35px_rgba(145,96,80,.08)]">
      <p class="text-[11px] sm:text-xs tracking-[.28em] text-beauty-terracotta mb-2">BOTANICAL BEAUTY COLLECTION</p>
      <h2 class="font-serif text-2xl sm:text-3xl font-bold text-beauty-deep">讓肌膚回到柔和、自然的狀態</h2>
      <p class="mt-2.5 sm:mt-3 text-xs sm:text-sm leading-6 sm:leading-7 text-beauty-deep/70 max-w-2xl">嚴選溫和配方與植萃成分，為日常保養留下一點舒服的餘裕。</p>
    </section>

    <main class="w-full">
      <div id="loading-state" class="py-20 text-center text-sm text-beauty-deep/55">正在準備商品型錄…</div>
      <div id="category-sections"></div>
    </main>
  </div>

  <!-- 商品詳細內容彈窗 -->
  <div id="product-modal" class="fixed inset-0 bg-beauty-deep/45 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4" role="dialog" aria-modal="true" aria-label="商品詳細內容">
    <div class="bg-beauty-cream w-full max-w-2xl max-h-[92vh] rounded-t-3xl sm:rounded-3xl border border-beauty-line flex flex-col shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-5 sm:px-6 py-4 bg-beauty-blush border-b border-beauty-line shrink-0">
        <h3 class="font-serif font-bold text-base sm:text-lg text-beauty-deep">商品詳細內容</h3>
        <button onclick="closeModal()" aria-label="關閉" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white border border-beauty-line text-beauty-deep hover:bg-beauty-cream transition">✕</button>
      </div>
      <div id="modal-content" class="overflow-y-auto p-4 sm:p-6 space-y-5 sm:space-y-6"></div>
      <div class="px-5 sm:px-6 py-3.5 sm:py-4 bg-beauty-blush border-t border-beauty-line text-[11px] sm:text-xs text-beauty-deep/65 text-center sm:text-left">如需課程體驗或商品批發，歡迎預約洽詢</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwbFJa2f6AhYsUj787Dj1jUrgZhVdh68Pax0X_EPq11eCGBaUUCEvE1ylvoIEiJW-Le2w/exec?api=products';
    const PROMO_CATEGORY = '限時促銷';
    let allProducts = [];
    let categoryOrder = [];

    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

    window.addEventListener('load', () => { fetchProducts(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    $('product-modal').addEventListener('click', e => { if (e.target.id === 'product-modal') closeModal(); });

    async function fetchProducts() {
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('API HTTP ' + res.status);
        const data = await res.json();
        allProducts = Array.isArray(data) ? data : [];
        
        if (allProducts.length === 0) {
          $('loading-state').classList.add('hidden');
          $('category-sections').innerHTML = '<div class="py-16 text-center text-sm text-beauty-deep/60">目前試算表中尚無商品資料。</div>';
          return;
        }

        buildCategories();
        renderCategorySections();
      } catch (err) {
        $('loading-state').classList.add('hidden');
        $('category-sections').innerHTML = '<div class="py-16 text-center text-sm text-beauty-deep/60">目前無法載入商品，請檢查網路連線。</div>';
      }
    }

    function buildCategories() {
      const counts = {};
      allProducts.forEach(p => { 
        const c = String(p.category || '未分類').trim(); 
        counts[c] = (counts[c] || 0) + 1; 
      });

      document.querySelectorAll('.category-dynamic').forEach(el => el.remove());
      let categories = Object.keys(counts).filter(cat => cat && cat !== '全部商品');
      categories.sort((a, b) => (a === PROMO_CATEGORY ? -1 : b === PROMO_CATEGORY ? 1 : 0));
      categoryOrder = categories;

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.id = 'btn-cat-' + encodeURIComponent(cat);
        btn.className = 'category-dynamic cat-btn text-left px-3.5 py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-between gap-3';
        // 點擊後滾動至該分類，並「自動收合」左側抽屜
        btn.onclick = () => { filterCategory(cat); toggleSidebar(); };
        btn.innerHTML = `<span>${esc(cat)}</span><span class="text-[11px] sm:text-xs text-beauty-deep/55">${counts[cat] || 0}</span>`;
        $('category-bar').appendChild(btn);
      });
    }

    function toggleSidebar() {
      const menu = $('sidebar-menu');
      const backdrop = $('sidebar-backdrop');
      menu.classList.toggle('open');
      backdrop.classList.toggle('open');
      const isOpen = menu.classList.contains('open');
      $('menu-toggle-btn').setAttribute('aria-expanded', String(isOpen));
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('is-active'));
      const active = $('btn-cat-' + encodeURIComponent(cat));
      if (active) active.classList.add('is-active');
      const section = $('category-section-' + encodeURIComponent(cat));
      if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderCategorySections() {
      $('loading-state').classList.add('hidden');
      $('category-sections').innerHTML = categoryOrder.map(cat => {
        const list = allProducts.filter(p => String(p.category || '').trim() === cat);
        const cards = list.map(p => {
          const image = p.coverImage || 'https://via.placeholder.com/600x848?text=No+Image';
          const promo = String(p.category || '').trim() === PROMO_CATEGORY;
          return `<article onclick="openModalByIndex(${allProducts.indexOf(p)})" class="bg-white/90 rounded-2xl border ${promo ? 'border-beauty-terracotta/70 ring-1 ring-beauty-terracotta/20' : 'border-beauty-line'} p-3 sm:p-4 shadow-sm hover:shadow-xl transition cursor-pointer group">
            <div class="relative w-full aspect-[210/297] rounded-xl bg-beauty-blush overflow-hidden mb-2.5 sm:mb-3">
              <img src="${esc(image)}" alt="${esc(p.name)}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300" loading="lazy">
              <span class="absolute top-2 left-2 ${promo ? 'bg-beauty-terracotta' : 'bg-beauty-deep/75'} text-white text-[9px] sm:text-[10px] font-bold px-2 py-0.5 rounded-full">${esc(p.category || '未分類')}</span>
            </div>
            <h3 class="font-bold text-xs sm:text-base text-beauty-deep group-hover:text-beauty-terracotta transition-colors line-clamp-1">${esc(p.name)}</h3>
            <div class="text-[10px] sm:text-xs text-beauty-deep/55 mt-1 line-clamp-1 sm:line-clamp-2">${esc(p.ingredients || '')}</div>
            <div class="mt-2.5 sm:mt-3 pt-2.5 sm:pt-3 border-t border-beauty-line/70 flex items-center justify-between">
              <span class="text-[10px] sm:text-xs font-semibold bg-beauty-blush text-beauty-deep/70 px-2 py-1 rounded">${esc(p.spec || '標準')}</span>
              <span class="text-xs sm:text-lg font-bold text-beauty-terracotta">NT$ ${esc(p.price || '0')}</span>
            </div>
          </article>`;
        }).join('');

        return `<section id="category-section-${encodeURIComponent(cat)}" class="category-section category-section-heading">
          <div class="flex items-center justify-between gap-3 mb-4 sm:mb-5 border-b border-beauty-line pb-3">
            <div><p class="text-[10px] sm:text-xs tracking-[.2em] text-beauty-terracotta">${cat === PROMO_CATEGORY ? 'SPECIAL OFFER' : 'COLLECTION'}</p><h2 class="font-serif text-xl sm:text-2xl font-bold text-beauty-deep mt-0.5 sm:mt-1">${esc(cat)}</h2></div>
            <span class="text-xs text-beauty-deep/50">${list.length} 項商品</span>
          </div>
          ${cards ? `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5">${cards}</div>` : '<div class="rounded-2xl border border-dashed border-beauty-line py-12 text-center text-sm text-beauty-deep/55">目前尚未建立此分類商品。</div>'}
        </section>`;
      }).join('');
    }

    function parseYouTubeId(url) {
      if (!url) return null;
      const match = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
      return match ? match[1] : null;
    }

    function openModalByIndex(index) { openModal(allProducts[index]); }
    function openModal(p) {
      if (!p) return;
      const cover = p.coverImage || 'https://via.placeholder.com/800x1131?text=No+Image';
      const ytId = parseYouTubeId(p.videoUrl);
      const ingredientsSection = p.ingredients && String(p.ingredients).trim() ? `<div class="bg-white p-3.5 sm:p-4 rounded-xl border border-beauty-line"><h4 class="font-bold text-xs sm:text-sm text-beauty-deep mb-2">主要成份</h4><p class="text-xs sm:text-sm text-beauty-deep/70 leading-6 sm:leading-7 whitespace-pre-line">${esc(p.ingredients)}</p></div>` : '';
      const videoSection = ytId ? `<div><h4 class="font-bold text-xs sm:text-sm text-beauty-deep mb-2.5 sm:mb-3">示範介紹影片</h4><div class="w-full aspect-video rounded-xl overflow-hidden border border-beauty-line bg-black"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${esc(ytId)}" allowfullscreen></iframe></div></div>` : '';
      const images = Array.isArray(p.descImages) ? p.descImages.filter(Boolean) : [];
      const descSection = images.length ? `<div><h4 class="font-bold text-xs sm:text-sm text-beauty-deep mb-2.5 sm:mb-3">詳細圖文介紹</h4><div class="space-y-3">${images.map(img => `<img src="${esc(img)}" class="w-full h-auto object-contain rounded-xl border border-beauty-line" loading="lazy">`).join('')}</div></div>` : '';
      
      $('modal-content').innerHTML = `
        <div class="w-full rounded-2xl overflow-hidden bg-beauty-blush border border-beauty-line"><img src="${esc(cover)}" class="w-full h-auto max-h-[50vh] sm:max-h-[60vh] object-contain"></div>
        <div class="border-b border-beauty-line pb-4"><span class="text-xs font-bold text-beauty-terracotta">${esc(p.category || '未分類')}</span><h2 class="text-xl sm:text-2xl font-serif font-bold text-beauty-deep mt-1">${esc(p.name)}</h2><div class="flex items-baseline gap-4 mt-2.5 sm:mt-3"><span class="text-xl sm:text-2xl font-bold text-beauty-terracotta">NT$ ${esc(p.price || '0')}</span><span class="text-xs sm:text-sm text-beauty-deep/60 bg-beauty-blush px-2.5 sm:px-3 py-1 rounded-full">${esc(p.spec || '標準')}</span></div></div>
        ${ingredientsSection}${videoSection}${descSection}
      `;
      $('product-modal').classList.remove('hidden');
      $('product-modal').classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() { $('product-modal').classList.add('hidden'); $('product-modal').classList.remove('flex'); document.body.style.overflow = ''; }
  </script>
</body>
</html>
